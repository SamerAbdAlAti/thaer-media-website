<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thaer Media UI Reference</title>
<style>
:root{--bg:#071414;--panel:#0c1f1f;--line:rgba(226,185,97,.22);--text:#f2f0e8;--muted:rgba(242,240,232,.62);--gold:#e2b961}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f6f2e6;--panel:#fffdf7;--line:rgba(120,90,20,.25);--text:#142020;--muted:rgba(20,32,32,.62);--gold:#7a5b14}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 16px}
h1{margin:0 0 10px;font-size:18px}
h1 small{color:var(--muted);font-weight:400;margin-inline-start:8px}
.filters{display:flex;flex-wrap:wrap;gap:14px}
.fgroup{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.fgroup b{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-inline-end:2px}
.chip{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#000}
main{padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card a{display:block;background:#000;aspect-ratio:4/3;overflow:hidden}
.card img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.meta{padding:8px 10px;font-size:12px}
.meta strong{display:block;font-size:13px;word-break:break-word}
.meta span{color:var(--muted)}
.count{color:var(--muted);margin:0 0 12px}
section.videos{margin-top:28px}
section.videos h2{font-size:15px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
video{width:100%;border-radius:10px;border:1px solid var(--line);background:#000}
.empty{color:var(--muted);padding:30px 0}
</style>
</head>

<div class="filters" id="filters"></div>
</header>

const VIDEOS = ["01-home-desktop-scroll-and-toggles.webm", "02-home-desktop-hovers-and-slider.webm", "03-home-mobile-menu-and-scroll.webm", "04-work-page-gallery-and-lightbox.webm", "05-contact-page.webm"];
const DIMS = [
  ["kind","Type"],["group","Page / group"],["vp","Viewport"],["lang","Lang"],["theme","Theme"]
];
const state = {kind:"full-page", group:"", vp:"", lang:"", theme:""};
try { Object.assign(state, JSON.parse(localStorage.getItem("uiref-filters")||"{}")); } catch(e) {}
function uniq(k, pool){ return [...new Set(pool.map(i=>i[k]).filter(Boolean))].sort(); }
function pool(upto){ return ITEMS.filter(i=>DIMS.slice(0,upto).every(([k])=>!state[k]||i[k]===state[k])); }
function renderFilters(){
  const box = document.getElementById("filters"); box.innerHTML = "";
  DIMS.forEach(([k,label],idx)=>{
    const vals = uniq(k, pool(idx));
    if (state[k] && !vals.includes(state[k])) state[k] = "";
    if (!vals.length) return;
    const g = document.createElement("div"); g.className = "fgroup";
    g.innerHTML = `<b>${label}</b>`;
    ["", ...vals].forEach(v=>{
      const b = document.createElement("button"); b.className = "chip"; b.textContent = v || "all";
      b.setAttribute("aria-pressed", String(state[k]===v));
      b.onclick = ()=>{ state[k]=v; save(); renderFilters(); renderGrid(); };
      g.appendChild(b);
    });
    box.appendChild(g);
  });
}
function save(){ try { localStorage.setItem("uiref-filters", JSON.stringify(state)); } catch(e) {} }
function renderGrid(){
  const list = pool(DIMS.length);
  document.getElementById("count").textContent = list.length + " screenshot" + (list.length===1?"":"s");
  const grid = document.getElementById("grid");
  grid.innerHTML = list.length ? list.map(i=>`
    <div class="card"><a href="${i.src}" target="_blank" rel="noopener"><img loading="lazy" src="${i.src}" alt="${i.name}"></a>
    <div class="meta"><strong>${i.group} · ${i.name}</strong><span>${[i.vp,i.lang,i.theme].filter(Boolean).join(" · ")} · ${i.kb} KB</span></div></div>`).join("")
    : '<p class="empty">Nothing matches these filters.</p>';
}
document.getElementById("vgrid").innerHTML = VIDEOS.map(v=>`<div><video controls preload="metadata" src="video/${v}"></video><div class="meta"><strong>${v}</strong></div></div>`).join("");
renderFilters(); renderGrid();
</script>
